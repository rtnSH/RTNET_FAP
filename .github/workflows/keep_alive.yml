name: Keep Render Awake

on:
  schedule:
    - cron: '*/50 * * * *' # 매 5분마다 실행
  workflow_dispatch: # Actions 탭에서 수동으로 'Run workflow' 버튼을 눌러 테스트 가능

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send ping request
        run: |
          export TZ='Asia/Seoul'
          echo "실행 시각 (KST): $(date)"
          curl -s https://rtnet-fap-redmine.onrender.com/ > /dev/null
          echo "Render 앱(https://rtnet-fap-redmine.onrender.com/)에 신호를 보냈습니다."
