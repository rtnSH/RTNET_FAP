<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-labelledby="title desc">
  <title id="title">Redmine Sync CI</title>
  <desc id="desc">로그인 화면 CI를 기반으로 만든 모바일 바로가기 아이콘</desc>
  <defs>
    <linearGradient id="ci-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#7ab8ff" />
    </linearGradient>
    <radialGradient id="ci-background" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#1c2533" />
      <stop offset="100%" stop-color="#0d1117" />
    </radialGradient>
  </defs>
  <rect width="192" height="192" rx="42" fill="url(#ci-background)" />
  <circle cx="96" cy="96" r="46" stroke="url(#ci-gradient)" stroke-width="9" fill="none" stroke-dasharray="68 28" stroke-linecap="round" />
  <circle cx="96" cy="96" r="27" stroke="url(#ci-gradient)" stroke-width="9" fill="none" stroke-dasharray="30 18" stroke-linecap="round" />
  <circle cx="96" cy="96" r="8" fill="url(#ci-gradient)" />
</svg>
